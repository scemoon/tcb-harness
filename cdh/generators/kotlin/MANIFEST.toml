[plugin]
name = "kotlin"
display_name = "Kotlin"
file_extension = ".kt"
mime_type = "text/x-kotlin"
default_outdir = "kotlin"
output_filename_template = "{name}.kt"
package_name_default = "types"

[features]
enums = true
allOf = true
oneOf = true
anyOf = true
nullable = true
readOnly = true
writeOnly = true
format_hints = ["date-time", "uuid", "email", "uri", "double"]
