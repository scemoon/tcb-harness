[plugin]
name = "typescript"
display_name = "TypeScript"
file_extension = ".ts"
mime_type = "text/typescript"
default_outdir = "."
output_filename_template = "{name}.ts"
package_name_default = "types"

[features]
enums = true
allOf = true
oneOf = true
anyOf = true
nullable = true
readOnly = true
writeOnly = true
format_hints = ["date-time", "uuid", "email", "uri", "double"]
