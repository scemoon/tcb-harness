# Development Workflow

Local development loop with hot reload and incremental testing.

```yaml
name: dev
version: 1.0.0

modes:
  # Interactive development with full stack
  full:
    commands:
      - name: start_dev_server
        command: cloud-spec dev start --env local
        parallel: true
        watch:
          - src/**
          - specs/**

      - name: run_tests
        command: cloud-spec test --watch --env local
        parallel: true

      - name: deploy_functions
        command: cloud-spec deploy functions --watch --env dev
        parallel: true

  # Backend only (fast iteration)
  backend:
    commands:
      - name: dev_functions
        command: cloud-spec dev functions --env local
        watch:
          - src/functions/**

      - name: test_functions
        command: cloud-spec test --watch --suite unit
        parallel: true

  # Frontend only
  frontend:
    commands:
      - name: dev_frontend
        command: cloud-spec dev frontend --env local
        watch:
          - src/frontend/**

      - name: type_check
        command: cloud-spec lint --types-only
        parallel: true

## Hot Reload Triggers

| File Change | Action |
|-------------|--------|
| `*.py` in functions | Redeploy function |
| `*.js` in frontend | Rebuild frontend |
| `SPEC.md` | Validate and update docs |
| `design/*` | No action (manual review) |

## Debugging

```bash
# Attach debugger
cloud-spec debug functions --name <function> --env dev

# View function logs
cloud-spec logs functions --name <function> --follow

# Open API docs
cloud-spec dev api-docs --env dev
```

## Environment Setup

```bash
# Initialize dev environment
cloud-spec dev init

# Pull development config
cloud-spec env pull --env dev

# Set up local database
cloud-spec db setup --env local

# Seed development data
cloud-spec db seed --env local --fixtures ./fixtures/
```

## Spec-First Development

```bash
# 1. Update SPEC.md with new requirement
vim SPEC.md

# 2. Validate spec changes
cloud-spec spec diff

# 3. Generate implementation stubs
cloud-spec spec generate --from FR-042

# 4. Implement
# ... code ...

# 5. Run tests
cloud-spec test --coverage

# 6. Mark AC complete
cloud-spec spec mark --ac FR-042-AC1
```
