# Standard Deployment Workflow

Full deployment pipeline from build to production.

```yaml
name: deploy
version: 1.0.0

stages:
  - name: validate
    required: true
    steps:
      - name: lint
        command: cloud-spec lint
        timeout: 5m

      - name: spec_check
        command: cloud-spec spec validate
        timeout: 2m

  - name: build
    required: true
    parallel: true
    steps:
      - name: backend_build
        command: cloud-spec build --target backend
        timeout: 10m
        artifacts:
          - name: backend
            path: ./dist/functions

      - name: frontend_build
        command: cloud-spec build --target frontend
        timeout: 15m
        artifacts:
          - name: frontend
            path: ./dist/static

  - name: test
    required: true
    parallel: true
    steps:
      - name: unit_tests
        command: cloud-spec test --suite unit
        timeout: 10m
        coverage_threshold: 80

      - name: integration_tests
        command: cloud-spec test --suite integration
        timeout: 20m
        env:
          DATABASE_URL: ${STAGING_DB_URL}

  - name: deploy_backend
    required: true
    steps:
      - name: deploy_functions
        command: cloud-spec deploy functions --env staging
        timeout: 5m
        env:
          PROVIDER: ${PROVIDER}
          REGION: ${REGION}

      - name: migrate_database
        command: cloud-spec db migrate --env staging
        timeout: 10m

  - name: deploy_frontend
    required: true
    steps:
      - name: deploy_hosting
        command: cloud-spec deploy hosting --env staging
        timeout: 5m

  - name: smoke_test
    required: true
    steps:
      - name: health_check
        command: curl -f ${STAGING_URL}/health
        timeout: 30s

      - name: api_smoke_test
        command: cloud-spec test --suite smoke --env staging
        timeout: 5m

  - name: deploy_production
    required: true
    conditions:
      branch: main
    steps:
      - name: confirm_production
        command: cloud-spec deploy confirm --env production
        timeout: 30s

      - name: deploy_production_backend
        command: cloud-spec deploy functions --env production
        timeout: 5m

      - name: deploy_production_frontend
        command: cloud-spec deploy hosting --env production
        timeout: 5m

      - name: production_smoke_test
        command: cloud-spec test --suite smoke --env production
        timeout: 5m
```

## Rollback Triggers

Deployment automatically rolls back if:

| Check | Threshold | Action |
|-------|-----------|--------|
| Health endpoint | HTTP 5xx | Immediate rollback |
| Smoke tests | Any failure | Immediate rollback |
| Error rate | > 1% in 5 min | Manual trigger |
| Latency | p99 > 2s | Manual trigger |
