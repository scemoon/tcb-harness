asyncapi: "3.0.0"
info:
  title: Test Events
  version: "1.1.0"
channels:
  user.created:
    address: user.created
    messages:
      userCreated:
        name: userCreated
        payload:
          $ref: "#/components/schemas/User"
    operations:
      publish:
        message:
          $ref: "#/components/messages/userCreated"
  user.deleted:
    address: user.deleted
    messages:
      userDeleted:
        name: userDeleted
        payload:
          $ref: "#/components/schemas/UserDeleted"
    operations:
      publish:
        message:
          $ref: "#/components/messages/userDeleted"
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email
    UserDeleted:
      type: object
      properties:
        id:
          type: string
        deleted_at:
          type: string
          format: date-time
      required:
        - id
        - deleted_at
  messages:
    userCreated:
      name: userCreated
      payload:
        $ref: "#/components/schemas/User"
    userDeleted:
      name: userDeleted
      payload:
        $ref: "#/components/schemas/UserDeleted"