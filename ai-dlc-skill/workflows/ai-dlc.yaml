name: ai-dlc
version: 4.0.0
description: >
  AI-DLC adaptive workflow for monorepo multi-component stacks.
  Master Agent evaluates complexity (L1-L5), selects phases, delegates
  via Task(general) agents. See core/adaptive-flow.md.

stack:
  topology: monorepo
  components: [native, desktop, web, backend, wxa, mya, tta]
  fr_namespaces:
    native: NATIVE-*
    desktop: DESKTOP-*
    web: WEB-*
    backend: BE-*
    wxa: WXA-*
    mya: MYA-*
    tta: TTA-*
    contracts: INT-*

phases:
  - name: understand
    label: "① Understand — 理解"
    description: >
      Capture intent, declare affects, produce spec delta (EARS),
      write BDD feature files.
    entry: phases/understand/prompt.md
    lifecycle: phases/understand/lifecycle.md
    rules: phases/understand/rules.md
    practices:
      - sdd
      - bdd
      - integration
    gates:
      - UND-001..006: Understand rules
      - Human review and approval
    artifacts:
      - aidlc/requirements.md
      - aidlc/openspec/changes/{id}/spec-delta.md
      - apps/{component}/features/{domain}/{feature}.feature
      - aidlc/features/cross-stack/{domain}/{feature}.feature
      - aidlc/contracts/api|events/{name}.{yaml,graphql}

  - name: plan
    label: "② Plan — 规划"
    description: >
      Design solution per-component + integration, decompose into DAG
      units, write test plans per layer.
    entry: phases/plan/prompt.md
    lifecycle: phases/plan/lifecycle.md
    rules: phases/plan/rules.md
    practices:
      - sdd
      - tdd
      - integration
    gates:
      - PLN-001..004: Plan rules
      - Human review and approval
    artifacts:
      - aidlc/openspec/changes/{id}/design.md
      - aidlc/openspec/changes/{id}/task-list.md
      - aidlc/openspec/changes/{id}/contract-diff.md

  - name: verify
    label: "③ Verify — 验证"
    description: >
      TDD red-green-refactor per scenario, contract verification,
      cross-stack e2e, quality gates.
    entry: phases/verify/prompt.md
    lifecycle: phases/verify/lifecycle.md
    rules: phases/verify/rules.md
    practices:
      - bdd
      - tdd
      - integration
    gates:
      - VRF-001..006: Verify rules
      - INT-001..006: Integration rules
      - STK-001..006: Stack rules
    artifacts:
      - apps/{component}/tests/{unit,integration,e2e}/test_{feature}.py
      - apps/{component}/features/steps/test_{feature}_steps.py
      - apps/{component}/src/{module}/{feature}.py
      - aidlc/tests/contract/test_{contract}.py
      - aidlc/tests/cross-stack/test_{flow}.py
      - aidlc/packages/shared/
      - aidlc/openspec/changes/{id}/contract-diff.md

  - name: deliver
    label: "④ Deliver — 交付"
    description: >
      Unified stack preview, per-component e2e, cross-stack e2e,
      staging, human approval, production BVT + stack rollback.
    entry: phases/deliver/prompt.md
    lifecycle: phases/deliver/lifecycle.md
    rules: phases/deliver/rules.md
    practices:
      - sdd
      - cloud
      - integration
    gates:
      - DLV-001..004: Deliver rules
      - STK-004..006: Stack deploy rules
    artifacts:
      - STACK_URL / BACKEND_URL
      - Per-component e2e report
      - Cross-stack e2e report
      - aidlc/openspec/changes/{id}/contract-diff.md
      - Stack BVT report
      - Deploy log
