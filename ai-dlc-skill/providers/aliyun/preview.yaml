# Aliyun Stack Preview

Preview deployment for the unified stack (backend + all clients: web, native, desktop, wxa, mya, tta). URL resolution is dynamic per platform; `BACKEND_URL` is injected into client builds at build time.

## Overview

`deploy_stack --preview --provider aliyun` deploys the full stack to an isolated preview environment and exports the stack URL. Used for per-component e2e AND cross-stack e2e verification before staging or production.

## Preview Flow

```
git push feature branch
  → deploy_stack --preview --provider aliyun
  → STACK_URL = BACKEND_URL = https://{gateway}.{region}.fc.devs.com
  → WEB_URL  = https://{bucket}.{region}.oss-website.aliyuncs.com
  → NATIVE_DIST_URL = internal distribution URL
  → DESKTOP_DIST_URL = internal distribution URL
  → WXA_URL / MYA_URL / TTA_URL = mini-program preview QR
  → Per-component e2e: pytest apps/{comp}/tests/e2e/ --base-url $URL
  → Cross-stack e2e:  pytest tests/cross-stack/ --stack-url $STACK_URL
  → TTL: 24h → auto cleanup
```

## Configuration

```yaml
preview:
  orchestrator: deploy_stack
  strategy: unified
  ttl: 24h
  auto_cleanup: true
  db_sandbox: true          # isolated DB per preview
  url_pattern_backend: "https://{gateway}.{region}.fc.devs.com"
  url_pattern_web:     "https://{bucket}.{region}.oss-website.aliyuncs.com"
  build_env:
    web:
      - BACKEND_URL
      - STACK_URL
    native:
      - BACKEND_URL
    desktop:
      - BACKEND_URL
    wxa:
      - BACKEND_URL
    mya:
      - BACKEND_URL
    tta:
      - BACKEND_URL
  env:
    - STACK_URL             # = BACKEND_URL (gateway)
    - BACKEND_URL
    - WEB_URL
    - NATIVE_DIST_URL
    - DESKTOP_DIST_URL
    - WXA_URL
    - MYA_URL
    - TTA_URL
    - DATABASE_URL (sandbox)
```

## BDD E2E Integration

```bash
# Deploy unified stack preview
export STACK_URL=$(deploy_stack --preview --provider aliyun --output url)
export BACKEND_URL=$STACK_URL
export WEB_URL=$(deploy_stack --preview --provider aliyun --output web_url)
export NATIVE_DIST_URL=$(deploy_stack --preview --provider aliyun --output native_url)
export DESKTOP_DIST_URL=$(deploy_stack --preview --provider aliyun --output desktop_url)

# Per-component e2e
pytest apps/backend/tests/e2e/ --base-url $BACKEND_URL
pytest apps/web/tests/e2e/ --base-url $WEB_URL --api-url $BACKEND_URL
pytest apps/native/tests/e2e/ --backend-url $BACKEND_URL
pytest apps/desktop/tests/e2e/ --backend-url $BACKEND_URL
pytest apps/wxa/tests/e2e/ --backend-url $BACKEND_URL
pytest apps/mya/tests/e2e/ --backend-url $BACKEND_URL
pytest apps/tta/tests/e2e/ --backend-url $BACKEND_URL

# Cross-stack e2e
pytest tests/cross-stack/ --stack-url $STACK_URL

# Cleanup (automatic after TTL)
```
