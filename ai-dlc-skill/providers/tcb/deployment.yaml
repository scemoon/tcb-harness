# TCB Stack Deployment

Production deployment pipeline for TCB. The default is the unified `deploy_stack` orchestrator; per-component deploys are only allowed into isolated dev sandboxes.

## Environments

| Environment | Purpose | Deploy Trigger | Orchestrator |
|-------------|---------|----------------|--------------|
| preview | Per-component + cross-stack e2e | Feature branch | `deploy_stack --preview` |
| staging | Pre-production stack validation | PR merge to main | `deploy_stack --env staging` |
| production | Live traffic | Release tag + human approval | `deploy_stack --env production` |

## Stack Deploy Steps

```yaml
staging:
  orchestrator: deploy_stack
  steps:
    - tcb fn deploy --all -e staging         # backend (all functions)
    - tcb fn deploy <functionName> -e staging # or deploy single function
    - tcb hosting deploy -e staging \
        --build-env BACKEND_URL=${STACK_URL}  # web
    - native build with BACKEND_URL injected  # native
    - desktop build with BACKEND_URL injected # desktop
    - wxa build with BACKEND_URL injected     # wxa
    - mya build with BACKEND_URL injected     # mya
    - tta build with BACKEND_URL injected     # tta
    - smoke-test ${STACK_URL}

production:
  orchestrator: deploy_stack
  pre_conditions:
    - human-approval-gate
  steps:
    - tcb fn deploy --all -e production
    - tcb fn deploy <functionName> -e production
    - tcb hosting deploy -e production \
        --build-env BACKEND_URL=${STACK_URL}
    - native build with BACKEND_URL injected
    - desktop build with BACKEND_URL injected
    - wxa build with BACKEND_URL injected
    - mya build with BACKEND_URL injected
    - tta build with BACKEND_URL injected
    - smoke-test ${PRODUCTION_URL}
    - health-check ${PRODUCTION_URL}/health
    - bvt ${PRODUCTION_URL}
```

## tcb fn deploy Command Reference

Deploy cloud functions using `tcb fn deploy [options] [name]`

### Key Options

| Option |说明 |
|--------|-----|
| `-e, --env-id <envId>` | Environment Id |
| `--httpFn` | Deploy as HTTP function |
| `--ws` | Enable WebSocket protocol for HTTP function |
| `--code-secret <codeSecret>` | Code encryption (36 char alphanumeric) |
| `--force` | Overwrite existing function with same name |
| `--path <path>` | Auto-create HTTP access path |
| `--dir <dir>` | Specify function folder path |
| `--all` | Deploy all functions in config file |
| `--deployMode <mode>` | Upload mode: `cos` (default), `zip` (≤1.5MB), `image` (mirror) |
| `--yes` | Skip confirmation prompts |

### Deployment Patterns

```bash
# Standard workspace (with cloudbaserc.json)
tcb fn deploy <functionName> -e <envId>
tcb fn deploy --all -e <envId>

# From function directory (auto-reads package.json)
cd my-function && tcb fn deploy

# HTTP function
tcb fn deploy <functionName> --httpFn

# Image deployment
tcb fn deploy <functionName> --deployMode image

# With code encryption
tcb fn deploy <functionName> --code-secret 7sGLwMnhgEfKmkqg2dMjB6xWk2hCxsAgGR6w

# CI/CD (skip confirmation)
tcb fn deploy <functionName> --yes --force
```

## Per-Component Dev Sandbox (allowed)

```bash
# Personal dev sandbox — one user, one component
tcb env create dev-${USER}
tcb fn deploy <functionName> --dir ./functions -e dev-${USER}
tcb hosting deploy -e dev-${USER}
# Per-component deploys to shared envs (preview/staging/production) are forbidden
```

## Stack Rollback

```bash
# Automatic on BVT failure
deploy_stack --rollback ${LAST_STABLE_STACK_VERSION} --provider tcb

# Manual on demand
deploy_stack --rollback --stack-version v1.2.3 --provider tcb
```

The previous stable stack version is identified by the last green BVT.
