# TCB Provider (Stack-aware)

Default cloud development platform. Supports the unified stack deploy (backend + all clients: web, native, desktop, wxa, mya, tta) and per-component deploys (for isolated dev sandboxes only).

## Metadata

```yaml
provider:
  name: tcb
  display_name: Tencent CloudBase
  default: true
  version: 3.0.0
  website: https://cloud.tencent.com/product/tcb

stack:
  components:
    - id: backend
      deploy_order: 1
      exposes: BACKEND_URL
    - id: web
      deploy_order: 2
      consumes: BACKEND_URL
    - id: native
      deploy_order: 2
      consumes: BACKEND_URL
    - id: desktop
      deploy_order: 2
      consumes: BACKEND_URL
    - id: wxa
      deploy_order: 2
      consumes: BACKEND_URL
    - id: mya
      deploy_order: 2
      consumes: BACKEND_URL
    - id: tta
      deploy_order: 2
      consumes: BACKEND_URL

regions:
  - id: ap-shanghai
    name: Shanghai
  - id: ap-beijing
    name: Beijing
  - id: ap-guangzhou
    name: Guangzhou
  - id: ap-singapore
    name: Singapore

services:
  - functions: cloudbase
  - database: cloudbase
  - storage: cloudbase
  - hosting: cloudbase

limits:
  function_timeout: 60s
  function_memory: 1536MB
  max_instances: 100

capabilities:
  - serverless_functions
  - static_hosting
  - serverless_database
  - serverless_storage
  - preview_deploy
  - ssl_cert
  - custom_domain
  - cdn_acceleration
  - stack_deploy
  - build_env_injection
```

## Stack Deploy (recommended for shared environments)

```bash
# Unified stack preview (returns STACK_URL = BACKEND_URL + per-component URLs)
deploy_stack --preview --provider tcb
# → backend:  tcb fn deploy --env preview
# → backend:  tcb db migrate --env preview
# → web:      tcb hosting deploy --env preview --build-env BACKEND_URL=${STACK_URL}
# → native:   build with BACKEND_URL injected; upload to internal distribution
# → desktop:  build with BACKEND_URL injected; upload to internal distribution
# → wxa:      build with BACKEND_URL injected; upload to mini-program platform
# → mya:      build with BACKEND_URL injected; upload to mini-program platform
# → tta:      build with BACKEND_URL injected; upload to mini-program platform
# → STACK_URL = https://{env-id}.tcb-preview.com

# Stack staging
deploy_stack --env staging --provider tcb

# Stack production (after human approval)
deploy_stack --env production --provider tcb

# Stack rollback
deploy_stack --rollback ${LAST_STABLE_STACK_VERSION} --provider tcb
```

## Per-Component Deploy (dev sandboxes only)

For isolated dev work on a single component, per-component deploy is allowed into a personal sandbox env.

```bash
# Functions
tcb fn deploy --name hello --dir ./functions
tcb fn invoke --name hello --params '{}'
tcb fn logs --name hello

# Database
tcb db query "SELECT * FROM users"
tcb db migrate

# Hosting (web only)
tcb hosting deploy --env dev-<user>

# Environment
tcb env list
tcb env use <env-id>
```

> Per-component deploys to shared environments (preview, staging, production) are forbidden (STK-004). Use `deploy_stack`.

## URL Resolution

| Component | Pattern |
|-----------|---------|
| `STACK_URL` / `BACKEND_URL` | `https://{env-id}.tcb-preview.com` |
| `WEB_URL` | `https://{env-id}-{project}.tcb-preview.com` |
| `NATIVE_DIST_URL` | internal distribution URL |
| `DESKTOP_DIST_URL` | internal distribution URL |
| `WXA_URL` | mini-program preview QR |
| `MYA_URL` | mini-program preview QR |
| `TTA_URL` | mini-program preview QR |

## Build Config Injection

```bash
tcb hosting deploy --env preview --build-env BACKEND_URL=$STACK_URL
# web reads process.env.BACKEND_URL at build time
```

## Environment Variables

| Variable | Description |
|----------|-------------|
| TCB_SECRET_ID | Tencent Cloud secret ID |
| TCB_SECRET_KEY | Tencent Cloud secret key |
| TCB_ENV_ID | CloudBase environment ID |
| BACKEND_URL | Stack URL injected at build time |
| STACK_URL | Alias of BACKEND_URL (gateway) |
