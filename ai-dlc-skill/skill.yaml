categories:
- ai-dlc
- development
- sdd
- bdd
- tdd
- specification
- cloud
- monorepo
- integration
description: >-
  AI-Driven Development Lifecycle for monorepo multi-component stacks
  (native + desktop + web + backend + wxa + mya + tta). Adaptive orchestration:
  Master Agent evaluates complexity, delegates sub-tasks via CDHA Task tool.
  Core phases: Understand (SDD+BDD) → Plan (SDD+TDD) → Verify (BDD+TDD) →
  Deliver (SDD+Cloud), with cross-stack Integration rules governing
  component boundaries. FR namespaces: NATIVE-*, DESKTOP-*, WEB-*, BE-*,
  WXA-*, MYA-*, TTA-*, INT-*. Default cloud platform: TCB. Also supports Aliyun.
enabled: true
entry: SKILL.md
name: ai-dlc-skill
version: 4.0.0

stack:
  topology: monorepo
  components:
    - id: native
      kind: mobile
      tech: react-native | flutter
      owns: apps/native
      fr_prefix: NATIVE
    - id: desktop
      kind: desktop
      tech: electron | tauri
      owns: apps/desktop
      fr_prefix: DESKTOP
    - id: web
      kind: frontend
      tech: react | vue | svelte
      owns: apps/web
      fr_prefix: WEB
    - id: backend
      kind: service
      tech: python | node | go
      owns: apps/backend
      fr_prefix: BE
    - id: wxa
      kind: mini-program
      tech: miniprogram
      owns: apps/wxa
      fr_prefix: WXA
    - id: mya
      kind: mini-program
      tech: miniprogram
      owns: apps/mya
      fr_prefix: MYA
    - id: tta
      kind: mini-program
      tech: miniprogram
      owns: apps/tta
      fr_prefix: TTA
  cross_cutting:
    fr_prefix: INT
    owns:
      - contracts/
      - packages/shared/
  e2e_layers:
    - unit
    - integration
    - e2e
    - cross-stack

integration:
  contract_first: true
  contract_format: openapi-3.1
  backward_compat: required
  breaking_change_gate: human-approval
  shared_types:
    generator: openapi-typescript | openapi-python
    output: packages/shared/
    publish: workspace-package
  event_contract:
    format: asyncapi | cloudevent
    registry: contracts/events/
    version_strategy: semver-major-for-breaking

deploy:
  preview:
    strategy: unified
    description: >-
      Single stack preview deploys all components together.
      PREVIEW_URL is the backend gateway; web, native, desktop,
      and mini-programs receive it as a build-time/runtime config.
    ttl: 24h
    bdd_target: cross-stack
  environments:
    - preview
    - staging
    - production

quality_gates:
  coverage_min: 80
  bdd_pass_rate: 100
  contract_diff: required
  no_todo: true
  no_secrets_in_diff: true

agents:
  - name: ai-dlc-master
    entry: SKILL.md
    mode: primary
  - name: ai-dlc-understand
    entry: phases/understand/entry.md
    mode: subagent
  - name: ai-dlc-plan
    entry: phases/plan/entry.md
    mode: subagent
  - name: ai-dlc-verify
    entry: phases/verify/entry.md
    mode: subagent
  - name: ai-dlc-deliver
    entry: phases/deliver/entry.md
    mode: subagent
