openapi: 3.1.0
info:
  title: {{title}}
  version: {{version}}
  description: |
    Implements INT-FR-{{int_fr_id}}.
    Consumers: {{consumers}}
    Producers: {{producers}}
  x-change-id: {{change_id}}
  x-fr: INT-FR-{{int_fr_id}}

servers:
