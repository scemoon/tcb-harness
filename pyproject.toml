[project]
name = "cloud-dev-harness"
version = "1.0.5"
description = "Cloud Dev Harness - cloud-native development Agent framework with A2TUI"
requires-python = ">=3.14.2"
dependencies = [
    "textual>=0.46.0",
    "textual[syntax]==8.2.6",
    "click==8.4.0",
    "platformdirs==4.9.6",
    "rich>=13.7.0",
    "rich==15.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "sqlite-utils>=3.35",
    "httpx>=0.25.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-serve>=1.1.2",
    "textual-speedups==0.2.1",
    "packaging==26.2",
    "bashlex==0.18",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "watchdog==6.0.0",
    "setproctitle==1.3.7",
    "psutil==7.2.2",
    "aiosqlite==0.22.1",
    "textual-diff-view==0.1.5",
    "typing-extensions==4.15.0",
]

[project.scripts]
cdh = "cdh.cli:main"
onecode-agent-acp = "onecode.agent.onecode_agent_acp:main"
onecode = "onecode.cli:main"
tui = "tui.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onecode*", "cdh*", "tui*"]

[tool.setuptools.package-data]
tui = [
    "tui.tcss",
    "screens/*.tcss",
    "data/**/*",
]
onecode = [
    "builtin_skills/**/*",
]

[tool.ruff]
exclude = ["tui/", "dist/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.21",
    "textual-dev>=1.8.0",
]
