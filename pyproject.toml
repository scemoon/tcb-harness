[project]
name = "cloud-dev-harness"
version = "1.4.0"
description = "Cloud Dev Harness - cloud-native development Agent framework"
requires-python = ">=3.0.0"
dependencies = [
    "textual>=0.46.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "sqlite-utils>=3.35",
    "httpx>=0.25.0",
]

[project.scripts]
cdh = "cdh.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdh*"]
