[project]
name = "tui"
version = "0.1.0"
description = "TUI - Terminal User Interface"

requires-python = ">=3.11"
dependencies = [
    "textual[syntax]==8.2.6",
    "click==8.4.0",
    "platformdirs==4.9.6",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-serve>=1.1.2",
    "textual-speedups==0.2.1",
    "packaging==26.2",
    "bashlex==0.18",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "watchdog==6.0.0",
    "setproctitle==1.3.7",
    "psutil==7.2.2",
    "aiosqlite==0.22.1",
    "textual-diff-view==0.1.5",
    "typing-extensions==4.15.0",
]

[project.scripts]
tui = "tui.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = {"." = "tui"}

[dependency-groups]
dev = ["mypy>=1.19.1", "pyinstrument>=5.1.1", "textual-dev>=1.8.0"]
